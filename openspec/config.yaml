schema: spec-driven

context: |
  Fukuruma is a retro-3D space exploration game. Design: docs/CONCEPT.md. Roadmap: docs/IMPLEMENTATION_PLAN.md.
  Core engine in C11 with SDL3 and OpenGL (3.3 core / GLES 3.0 / WebGL 2 subset); game logic in Lua 5.4.
  Targets: Windows, Linux, macOS, Web (Emscripten) and WebXR. Every design and task list must cover all five.
  Assets, scripts and shaders are loaded from data/ and mods/ beside the binary, never compiled into it.
  Licences: code (C, Lua, GLSL, JS, tools) MIT; art (textures, models, voxels, sprites, sounds, music) CC BY 4.0.
  Work happens on main only. CI must be green on every target; Pages deploys only green builds.
  Every change needs unit tests (C and Lua line coverage each >= 95%) and at least one automated game test.
  The simulation is deterministic and command-based (co-op later); generation must give identical results on every platform.
  Agents follow the ponytail rules in AGENTS.md: the smallest complete change.

rules:
  proposal:
    - State what is out of scope.
    - Name the automated game test that will prove the change.
  tasks:
    - End every task list with a group that covers tests, coverage, CI on all targets and the Pages deployment.
